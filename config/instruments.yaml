# === 关联组配置 === #
# 来自交易系统(1)2019.10.11.xlsx Sheet2
# 同组品种合计 Unit 上限为 10（关联组约束）
correlated_groups:
  metals:
    name: 贵有色金属
    members: [AG, AU, CU, AL, ZN, PB, NI, SN]
    max_units: 10
    note: "黄金+白银为强关联；铜/铝/锌/铅/镍/锡为有色金属组"

  steel:
    name: 黑色金属
    members: [RB, HC, I, J, JM]
    max_units: 10
    note: "螺纹/热卷/铁矿/焦炭/焦煤；热卷是否并入螺纹组待季度确认"

  energy:
    name: 能源化工
    members: [TA, MA, BU, EG, PVC, L, PP, RU]
    max_units: 10

  agriculture:
    name: 农产品
    members: [M, Y, RM, OI, P, SR, CF, A, C, JD, CS]
    max_units: 10

  building:
    name: 建材
    members: [FG]
    max_units: 10

# === 组合约束 === #
portfolio_limits:
  single_instrument_max: 4       # 单品种最多 4 Unit
  high_correlation_max: 6       # 高度相关市场合计 6 Unit
  directional_max: 12            # 单一方向（多或空）全市场最多 12 Unit
  correlated_group_max: 10       # 关联组合计最多 10 Unit

# === 不交易品种 === #
# 来自 Sheet2 备注：粳米、20号胶、棉纱、纤板、菜籽、郑麦、晚稻、线材、胶板、普麦、早稻、粳稻
excluded_symbols:
  - JR       # 粳稻
  - TS       # 20号胶（国产胶）
  - CY       # 棉纱
  - FB       # 纤板
  - RS       # 菜籽
  - WH       # 郑麦
  - LR       # 晚稻
  - WR       # 线材
  - BB       # 胶板
  - PM       # 普麦
  - RI       # 早稻