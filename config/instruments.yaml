    name: 白银
    code: AG
    contract_size: 15            # 15千克/手
    price_unit: "元/千克"
    tick: 1                      # 变动价位：1元/千克
    point_value: 15              # 每点价值 = contract_size * tick = 15元
    margin_ratio: 0.08           # 保证金比例 8%
    atr_initial: 20              # 初始 ATR(N值)
    direction: 1                 # 1=做多, -1=做空
    correlated_group: metals
    delivery_months: [1,3,5,7,9,11]  # 月交替

  AU:
    name: 黄金
    code: AU
    contract_size: 1000         # 1000克/手
